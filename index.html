<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>领取</title>
<style>
*{margin:0;padding:0}
body{
  width:100vw;
  height:100vh;
  background:#000;
  overflow:hidden;
}
.page{
  position:absolute;
  inset:0;
  display:none;
}
.page.active{display:block}
img{
  width:100%;
  height:100%;
  object-fit:contain;
}
button{
  position:absolute;
  inset:0;
  background:transparent;
  border:none;
}
</style>
</head>
<body>

<div class="page active" id="p1">
  <img src="图片1.jpg.jpg">
  <button onclick="go()"></button>
</div>

<div class="page" id="p2">
  <img src="图片2.jpg.jpg">
  <audio id="music" src="库里.mp3.qta"></audio>
</div>

<script>
function go(){
  document.getElementById('p1').classList.remove('active');
  document.getElementById('p2').classList.add('active');
  document.getElementById('music').play();
}
</script>

</body>
</html>
