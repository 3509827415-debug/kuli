<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>领取</title>

  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    .page {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page img {
      max-width: 100%;
      max-height: 100%;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <!-- 第一屏 -->
  <div id="page1" class="page">
    <img src="img1.jpg" alt="">
  </div>

  <!-- 第二屏 -->
  <div id="page2" class="page hidden">
    <img src="img2.jpg" alt="">
  </div>

  <!-- 音乐 -->
  <audio id="bgm" src="kuli.mp3" preload="auto"></audio>

  <script>
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const bgm = document.getElementById('bgm');

    let started = false;

    document.body.addEventListener('click', () => {
      if (started) return;
      started = true;

      // 切换画面
      page1.classList.add('hidden');
      page2.classList.remove('hidden');

      // 立即播放音乐（微信可用）
      bgm.currentTime = 0;
      bgm.play();
    }, { once: true });
  </script>

</body>
</html>
